<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>d-fool® — Carousel TV</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>

/* ─── RESET & ROOT ─────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:        #E8D8E7;   /* fond violet très clair */
  --bg2:       #CEAACB;   /* fond des cartes animations */
  --bg3:       #DAC2D9;   /* intermédiaire */
  --orange:    #CC0000;   /* rouge Arena */
  --orange-lo: rgba(200,0,0,.15);
  --gold:      #FFD700;   /* jaune — heures, horloge */
  --gold-lo:   rgba(255,215,0,.22);
  --purple:    #81227C;   /* violet foncé — texte animations, AMUZBAR */
  --purple-lo: rgba(129,34,124,.18);
  --purple-dk: #5A0A55;   /* violet très sombre — fond badges pill */
  --teal:      #1A7870;
  --white:     #81227C;   /* texte principal = violet foncé */
  --gray:      #B88AB6;   /* bordures */
  --muted:     #9A5098;   /* texte atténué */
  --light:     #81227C;   /* texte secondaire */
}

html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--white);
  font-family: 'Inter', sans-serif;
}

/* ─── ARCS DÉCORATIFS (style carte AmuzBar) ─────────────── */
body::before {
  content: '';
  position: fixed;
  width: 90vh; height: 90vh;
  border-radius: 50%;
  top: -30vh; right: -20vh;
  background: radial-gradient(circle, rgba(255,255,255,.28) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  width: 65vh; height: 65vh;
  border-radius: 50%;
  bottom: -18vh; left: -12vh;
  background: radial-gradient(circle, rgba(255,255,255,.20) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.screen { position: relative; z-index: 1; }

/* ─── SCREEN GRID ─────────────────────────────────────── */
/* gauche (vidéo pleine hauteur) | droite (header + progress + schedule) */
.screen {
  display: grid;
  grid-template-columns: 40vw 1fr;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ─── COLONNE DROITE ──────────────────────────────────── */
.right-col {
  display: grid;
  grid-template-rows: 11vh 3px 1fr;
  border-left: 1px solid var(--gray);
  overflow: hidden;
}

/* ─── HEADER ──────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--gold);
  padding: 2vh 3vw 1.5vh;
  position: relative;
  z-index: 20;
}
/* La date prend tout l'espace disponible et se centre */
header .header-mid {
  flex: 1;
  text-align: center;
}

.logo {
  font-family: 'Inter', sans-serif;
  font-size: 4.2vh;
  font-weight: 900;
  letter-spacing: -.02em;
  line-height: 1;
  color: var(--white);
  text-transform: lowercase;
}

.header-mid { text-align: center; line-height: 1.2; }
.day-str {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.6vh;
  letter-spacing: .12em;
  color: var(--white);
}
.slide-badge {
  display: inline-block;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.35vh;
  letter-spacing: .4em;
  padding: .35vh 1.4vh;
  border-radius: 10vh;
  margin-top: .5vh;
  transition: background .4s, color .4s;
  background: var(--gray);
  color: var(--light);
}
.slide-badge.is-video { background: rgba(129,34,124,.18); color: var(--purple); }
.slide-badge.is-promo { background: rgba(255,255,255,.55); color: var(--purple); }

.header-right {
  display: flex;
  align-items: center;
  gap: 2vh;
}
.header-right-text { text-align: right; }
.clock {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 6.5vh;
  color: var(--gold);
  letter-spacing: .1em;
  line-height: 1;
  background: var(--purple-dk);
  border-radius: 1.2vh;
  padding: .55vh 1.4vh;
  display: inline-flex;
  align-items: center;
  border: 1.5px solid rgba(255,215,0,.25);
}
.sync-line {
  font-size: 1.3vh;
  letter-spacing: .08em;
  color: var(--muted);
  margin-top: .4vh;
}
.sync-dot {
  display: inline-block;
  width: .8vh; height: .8vh;
  border-radius: 50%;
  background: var(--muted);
  vertical-align: middle;
  margin-right: .4em;
}
.sync-dot.ok   { background: var(--teal); }
.sync-dot.err  { background: #ef4444; }
.sync-dot.demo { background: var(--gold); }

/* ─── PROGRESS BAR ─────────────────────────────────────── */
.progress-bar {
  background: var(--gray);
  position: relative;
  overflow: hidden;
  z-index: 20;
}
#progressFill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: var(--gold);
}

/* ─── LEFT AREA ─────────────────────────────────────────── */
.left-area {
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
/* Fond violet quand pas de vidéo ; le player couvre quand une vidéo joue */
#slide-video { background: var(--bg); }


.left-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.left-slide.active {
  opacity: 1;
  pointer-events: auto;
}

/* Video portrait — remplit toute la hauteur de la colonne gauche */
#slide-video video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background: var(--bg);
}

/* Promo in left column — compact for portrait column */
#slide-promo {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4vh 3.5vh;
  text-align: center;
  background: radial-gradient(ellipse at 50% 55%, rgba(255,255,255,.22) 0%, transparent 68%);
}
.promo-line1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 7vh;
  color: var(--white);
  letter-spacing: .04em;
  line-height: 1;
}
.promo-line2 {
  font-size: 3.6vh;
  font-weight: 700;
  color: var(--purple);
  line-height: 1.2;
  margin-top: 2.5vh;
}
.promo-line3 {
  font-size: 2.6vh;
  color: var(--muted);
  margin-top: 1.5vh;
  line-height: 1.4;
}
.promo-badge {
  display: inline-block;
  background: var(--purple-dk);
  color: var(--gold);
  border-radius: 10vh;
  padding: .5vh 1.8vh;
  font-size: .75em;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  vertical-align: middle;
  line-height: 1.5;
  border: 1.5px solid rgba(255,215,0,.3);
}
.promo-photo {
  width: 60%;
  height: auto;
  max-height: 35vh;
  border-radius: 1.5vh;
  object-fit: cover;
  margin-top: 3vh;
  border: 1px solid var(--gray);
  display: none;
  flex-shrink: 0;
}
.promo-photo.visible { display: block; }

/* ─── SCHEDULE PANEL (always visible — right column) ───── */
.schedule-panel {
  padding: 2.5vh 3vw 2.5vh 2.5vw;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sched-section {
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sched-arena { flex: 3; }
.sched-amuz  { flex: 2; }
.sched-section + .sched-section {
  border-top: 1px solid var(--gray);
  padding-top: 2vh;
  margin-top: 2vh;
}

.sched-section-head {
  display: flex;
  align-items: center;
  gap: 1.5vh;
  margin-bottom: 1.5vh;
  flex-shrink: 0;
}
.sched-lbl {
  font-family: 'Lilita One', cursive;
  font-size: 3.2vh;
  letter-spacing: .06em;
  line-height: 1;
  background: #ffffff;
  border-radius: 2vh;
  padding: .5vh 1.8vh;
  display: inline-block;
}
.sched-lbl.arena { color: var(--purple); }
.sched-lbl.amuz  { color: var(--purple); }

/* Badge style carte AmuzBar — pill sombre + texte or */
.sched-tag {
  font-size: 1vh;
  letter-spacing: .2em;
  text-transform: uppercase;
  padding: .45vh 1.6vh;
  border-radius: 10vh;
  font-weight: 700;
  align-self: center;
  background: var(--purple-dk);
  color: var(--gold);
  border: 1.5px solid rgba(255,215,0,.3);
}

.sched-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: .7vh;
  overflow: hidden;
}

/* Current event card in schedule panel */
.sc-current {
  border-radius: .8vh;
  padding: 1.2vh 1.8vh;
  flex-shrink: 0;
}
.sc-current.arena { background: var(--purple-lo); border: 1.5px solid rgba(129,34,124,.5); }
.sc-current.amuz  { background: var(--purple-lo); border: 1.5px solid rgba(141,22,128,.4); }

.sc-now-label {
  font-size: 1.1vh;
  letter-spacing: .3em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: .5vh;
  margin-bottom: .6vh;
}
.sc-now-label.arena { color: var(--purple); }
.sc-now-label.amuz  { color: var(--purple); }

.sc-now-row {
  display: flex;
  align-items: baseline;
  gap: 1.5vh;
}
.sc-now-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 4.2vh;
  color: var(--gold);
  letter-spacing: .08em;
  line-height: 1;
  flex-shrink: 0;
  background: var(--purple-dk);
  border-radius: .9vh;
  padding: .45vh 1vh;
  display: inline-flex;
  align-items: center;
  border: 1.5px solid rgba(255,215,0,.2);
}
.sc-now-title {
  font-size: 3.6vh;
  font-weight: 600;
  color: var(--white);
  line-height: 1.25;
}
.sc-now-zone {
  font-size: 1.1vh;
  letter-spacing: .15em;
  text-transform: uppercase;
  margin-top: .4vh;
}
.sc-now-zone.arena { color: var(--purple); }
.sc-now-zone.amuz  { color: var(--purple); }

/* Upcoming label */
.sc-upcoming-lbl {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3vh;
  letter-spacing: .4em;
  color: var(--light);
  flex-shrink: 0;
  margin-top: .3vh;
}

/* Upcoming item */
.sc-item {
  display: flex;
  align-items: center;
  gap: 1.5vh;
  padding: .9vh 1.5vh;
  background: var(--bg2);
  border-radius: .6vh;
  border: 1px solid transparent;
  flex-shrink: 0;
}
.sc-item.is-next-arena { border-color: rgba(129,34,124,.4); }
.sc-item.is-next-amuz  { border-color: rgba(141,22,128,.3); }

.sc-item-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.8vh;
  color: var(--gold);
  letter-spacing: .06em;
  line-height: 1;
  flex-shrink: 0;
  background: var(--purple-dk);
  border-radius: .8vh;
  padding: .4vh .9vh;
  display: inline-flex;
  align-items: center;
  border: 1.5px solid rgba(255,215,0,.2);
}
.sc-item-body { flex: 1; min-width: 0; overflow: visible; }
.sc-item-title {
  font-size: 3vh;
  font-weight: 600;
  line-height: 1.2;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
}
.sc-now-title {
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
}
.sc-item-zone {
  font-size: 1.1vh;
  color: var(--light);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-top: .2vh;
}
.sc-next-tag {
  display: inline-block;
  font-size: .95vh;
  letter-spacing: .18em;
  font-weight: 700;
  text-transform: uppercase;
  padding: .25vh .9vh;
  border-radius: .4vh;
  margin-left: 1vh;
  vertical-align: middle;
  position: relative;
  top: -.15vh;
}
.sc-next-tag.arena { background: var(--purple-dk); color: var(--gold); }
.sc-next-tag.amuz  { background: var(--purple); color: #fff; }

.sc-empty {
  font-size: 1.8vh;
  color: var(--muted);
  font-style: italic;
  padding: 1.5vh 0;
}

/* ─── PULSE ANIMATION ─────────────────────────────────── */
.pulse {
  width: .9vh; height: .9vh;
  border-radius: 50%;
  animation: pulseAnim 1.6s ease-in-out infinite;
  flex-shrink: 0;
  display: inline-block;
}
.pulse.arena { background: var(--purple); }
.pulse.amuz  { background: var(--purple); }
@keyframes pulseAnim {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.3; transform:scale(1.4); }
}

/* ─── GEAR BUTTON ─────────────────────────────────────── */
.gear-btn {
  background: transparent;
  border: 1px solid var(--gray);
  color: var(--muted);
  width: 3.6vh; height: 3.6vh;
  border-radius: .5vh;
  cursor: pointer;
  font-size: 1.7vh;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
  flex-shrink: 0;
}
.gear-btn:hover { border-color: var(--gold); color: var(--gold); }

/* ─── NAV ARROWS ─────────────────────────────────────── */
.nav-arrow {
  position: fixed;
  bottom: 2.5vh;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  color: rgba(255,255,255,.25);
  width: 4.5vh;
  height: 4.5vh;
  border-radius: 50%;
  font-size: 2vh;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .3s ease;
  z-index: 300;
  user-select: none;
}
.nav-arrow:hover {
  background: rgba(255,255,255,.18);
  color: var(--white);
  border-color: rgba(255,255,255,.35);
}
#navPrev { right: calc(3vw + 5.5vh); }
#navNext { right: 3vw; }

/* ─── SETUP OVERLAY ───────────────────────────────────── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.93);
  z-index: 200;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
}
.overlay.open { display: flex; }
.setup-box {
  background: #141414;
  border: 1px solid var(--gold);
  border-radius: 1.5vh;
  padding: 4vh 5vh;
  width: min(860px, 86vw);
}
.setup-box h2 {
  font-family: 'Lilita One', cursive;
  font-size: 3.2vh;
  letter-spacing: .06em;
  color: var(--gold);
  margin-bottom: 2.5vh;
}
.setup-section-title {
  font-size: 1.2vh;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 1.2vh;
  margin-top: 2vh;
}
.setup-row {
  display: flex;
  align-items: center;
  gap: 2vh;
  margin-bottom: 1.2vh;
}
.setup-row label {
  font-size: 1.6vh;
  color: var(--light);
  min-width: 22vh;
  flex-shrink: 0;
}
.setup-box input[type="url"],
.setup-box input[type="text"] {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--gray);
  border-radius: .8vh;
  padding: 1.2vh 1.8vh;
  color: var(--white);
  font-family: 'Inter', sans-serif;
  font-size: 1.5vh;
  outline: none;
  transition: border-color .2s;
}
.setup-box input[type="number"] {
  width: 10vh;
  background: var(--bg3);
  border: 1px solid var(--gray);
  border-radius: .8vh;
  padding: 1.2vh 1.8vh;
  color: var(--white);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2vh;
  text-align: center;
  outline: none;
  transition: border-color .2s;
  -moz-appearance: textfield;
}
.setup-box input:focus { border-color: var(--gold); }
.setup-box input[type="number"]::-webkit-outer-spin-button,
.setup-box input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
.setup-unit { font-size: 1.5vh; color: var(--muted); }
.setup-sep { height: 1px; background: var(--gray); margin: 2.5vh 0 1vh; }
.setup-actions { display: flex; gap: 1.5vh; align-items: center; margin-top: 2.5vh; }
.btn-ok {
  background: var(--gold); color: #000;
  border: none; padding: 1.4vh 4vh;
  border-radius: .8vh; font-weight: 700;
  font-size: 1.6vh; cursor: pointer;
  letter-spacing: .06em; font-family: 'Inter', sans-serif;
  transition: opacity .2s;
}
.btn-ok:hover { opacity: .85; }
.btn-cancel {
  background: transparent; color: var(--light);
  border: 1px solid var(--gray); padding: 1.4vh 3vh;
  border-radius: .8vh; font-size: 1.6vh;
  cursor: pointer; font-family: 'Inter', sans-serif;
  transition: all .2s;
}
.btn-cancel:hover { border-color: var(--white); color: var(--white); }
.setup-note { font-size: 1.3vh; color: var(--muted); margin-left: auto; }

</style>
</head>
<body>

<!-- ═══ SETUP OVERLAY ════════════════════════════════════ -->
<div class="overlay" id="setupOverlay">
  <div class="setup-box">
    <h2>⚙ Réglages du carousel TV</h2>

    <div class="setup-section-title">Connexion Google Sheets</div>
    <div class="setup-row">
      <label>URL Apps Script</label>
      <input type="url" id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec" />
    </div>

    <div class="setup-sep"></div>
    <div class="setup-section-title">Durées des slides</div>

    <div class="setup-row">
      <label>💬 Durée des promos</label>
      <input type="number" id="cfgPromo" min="3" max="120" value="5" />
      <span class="setup-unit">secondes</span>
    </div>

    <div class="setup-actions">
      <button class="btn-ok" onclick="saveSetup()">Enregistrer &amp; relancer</button>
      <button class="btn-cancel" onclick="closeSetup()">Annuler</button>
      <span class="setup-note">Les réglages sont mémorisés dans le navigateur.</span>
    </div>
  </div>
</div>


<!-- ═══ SCREEN ════════════════════════════════════════════ -->
<div class="screen">

  <!-- ▶ GAUCHE : Vidéo portrait / Promo — pleine hauteur écran ── -->
  <div class="left-area">

    <!-- Vidéo MP4 portrait -->
    <div class="left-slide" id="slide-video">
      <video id="videoPlayer" autoplay muted playsinline preload="auto"></video>
    </div>

    <!-- Message promo -->
    <div class="left-slide" id="slide-promo">
      <div class="promo-line1" id="promoL1">—</div>
      <div class="promo-line2" id="promoL2">—</div>
      <div class="promo-line3" id="promoL3">—</div>
      <img class="promo-photo" id="promoPhoto" src="" alt="">
    </div>

  </div><!-- /left-area -->

  <!-- ─── DROITE : Header + Progress + Schedule ─────────── -->
  <div class="right-col">

    <!-- ── HEADER ── -->
    <header>
      <!-- Logo à gauche de la zone droite -->
      <div class="logo">d-fool<span style="font-style:normal">®</span></div>

      <div class="header-mid">
        <div class="day-str" id="dayStr">—</div>
        <div class="slide-badge" id="slideBadge">CAROUSEL</div>
      </div>

      <div class="header-right">
        <div class="header-right-text">
          <div class="clock" id="clock">--:--</div>
          <div class="sync-line">
            <span class="sync-dot" id="syncDot"></span>
            <span id="syncLbl">chargement…</span>
          </div>
        </div>
        <button class="gear-btn" title="Réglages du carousel" onclick="openSetup()">⚙</button>
      </div>
    </header>

    <!-- ── PROGRESS BAR ── -->
    <div class="progress-bar"><div id="progressFill"></div></div>

    <!-- ── SCHEDULE PANEL ── -->
    <div class="schedule-panel">

      <!-- Arena section -->
      <div class="sched-section sched-arena">
        <div class="sched-section-head">
          <span class="sched-lbl arena">ARENA</span>
          <span class="sched-tag arena">Ticket requis</span>
        </div>
        <div class="sched-body" id="schedArena">
          <div class="sc-empty">Chargement…</div>
        </div>
      </div>

      <!-- AmuzBar section -->
      <div class="sched-section sched-amuz">
        <div class="sched-section-head">
          <span class="sched-lbl amuz">AMUZBAR</span>
          <span class="sched-tag amuz">Accès libre</span>
        </div>
        <div class="sched-body" id="schedAmuz">
          <div class="sc-empty">Chargement…</div>
        </div>
      </div>

    </div><!-- /schedule-panel -->

  </div><!-- /right-col -->


</div><!-- /screen -->

<!-- ── FLÈCHES DE NAVIGATION ── -->
<button class="nav-arrow" id="navPrev" title="Étape précédente" onclick="navPrev()">&#9664;</button>
<button class="nav-arrow" id="navNext" title="Étape suivante"   onclick="navNext()">&#9654;</button>


<script>
/* ══════════════════════════════════════════════════════════
   CONFIG STATIQUE — modifiable via le bouton ⚙
══════════════════════════════════════════════════════════ */

const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwWbQc-UUSLMq0dXe9sZw6w24azhxqrFOJWgGUhw0QrLVPykDF3qiCYBphauijfKP8j4g/exec';
const REFRESH_MS  = 15 * 1000;  // rafraîchissement données toutes les 15 s

/* Fichiers MP4 — détectés automatiquement au démarrage via requêtes HEAD.
   Ajoute Video_008.mp4, Video_009.mp4… sur Netlify : ils seront inclus
   automatiquement au prochain chargement de la page. */
let VIDEOS = [
  'Video_001.mp4',
  'Video_002.mp4',
  'Video_003.mp4',
  'Video_004.mp4',
  'Video_005.mp4',
  'Video_006.mp4',
  'Video_007.mp4',
];

/* ══════════════════════════════════════════════════════════
   ✏️  MESSAGES PROMO — modifie ici tes textes publicitaires
   • line1 : titre (grand, blanc, Bebas Neue)
   • line2 : sous-titre (or/jaune, gras)
   • line3 : texte complémentaire (gris clair)
   • photo : laisse '' — l'image est chargée automatiquement
             depuis Image_001.png (promo 1), Image_002.png (promo 2)…
             Dépose les fichiers sur Netlify pour qu'ils apparaissent.
══════════════════════════════════════════════════════════ */
const PROMOS = [
  {
    line1: 'Une petite faim ?',
    line2: 'Pensez à nos <span class="promo-badge">croque-monsieur</span> à partager.',
    line3: 'Mmm… ils viennent de chez Messieurs à Liège',
    photo: '',
  },
  {
    line1: 'Vos tickets Arena moins chers ?',
    line2: 'Pensez à la <span class="promo-badge">carte à partager</span>.',
    line3: 'Le bon plan pour revenir… seul ou en groupe.',
    photo: '',
  },
  {
    line1: 'Happy Hours<br>17h17 → 19h19',
    line2: 'Mercredis, jeudis &amp; vendredis',
    line3: '<span class="promo-badge">-50% sur les boissons</span>',
    photo: '',
  },
];

/* ── Durées (localStorage ou valeurs par défaut) ─────── */
function loadDurations() {
  return {
    promo: (parseInt(localStorage.getItem('c_promo')) || 10) * 1000,
  };
}
let durations = loadDurations();
let sheetUrl  = localStorage.getItem('c_url') || DEFAULT_URL;

/* ── Données de démo (utilisées si la feuille est vide) ─ */
const DEMO_ARENA = [
  { time:"10:15", title:"Tournoi Pixel Games : Switch VS",              zone:"Pixel" },
  { time:"11:00", title:"Battre un défouleur sur le Stomp",             zone:"Valo-Jump" },
  { time:"12:00", title:"Monster Match Multiball",                      zone:"Multiball" },
  { time:"13:00", title:"Puissance 4 Géant : clients vs défouleurs",   zone:"Puissance 4" },
  { time:"14:00", title:"Tournoi Blink Pro 🏆",                        zone:"Blink Pro" },
  { time:"15:00", title:"Combat de Joutes — défie un défouleur !",     zone:"Joutes" },
  { time:"16:00", title:"Highscore Hunt — meilleur score possible 🎯", zone:"Pixel" },
  { time:"17:00", title:"FINALE du tournoi du jour 🔥",                zone:"Arena" },
];
const DEMO_AMUZ = [
  { time:"11:00", title:"Bras de fer — Bats Tim le Grand 💪",    zone:"Bras de fer" },
  { time:"13:00", title:"Blind Test / Quiz",                       zone:"AmuzBar" },
  { time:"15:00", title:"Curling express",                         zone:"Curling" },
  { time:"17:00", title:"Karaoké 🎤 (jusqu'à la fermeture)",      zone:"Karaoké" },
];

let arenaData = [...DEMO_ARENA];
let amuzData  = [...DEMO_AMUZ];
let isDemo    = true;

/* ══════════════════════════════════════════════════════════
   UTILITAIRES
══════════════════════════════════════════════════════════ */
function toMin(t)   { const [h,m] = t.split(':').map(Number); return h*60+m; }
function fmtTime(t) { return t.replace(':', 'h'); }
function nowMin()   { const d = new Date(); return d.getHours()*60 + d.getMinutes(); }

const DAYS   = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet',
                'août','septembre','octobre','novembre','décembre'];

function dayLabel() {
  const d = new Date();
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function clockStr() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ══════════════════════════════════════════════════════════
   FETCH GOOGLE SHEETS
══════════════════════════════════════════════════════════ */
async function fetchSheet() {
  if (!sheetUrl) return false;
  try {
    const url  = sheetUrl + (sheetUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = (await resp.text()).trim();

    let arena = [], amuzbar = [];
    if (sheetUrl.includes('script.google.com') || text.startsWith('[')) {
      JSON.parse(text).forEach(r => {
        const ev = {
          time:  String(r.heure     || '').trim(),
          title: String(r.animation || '').trim(),
          zone:  String(r.zone      || '').trim(),
        };
        if (!ev.title || !ev.time) return;
        (/amuz/i.test(r.espace) ? amuzbar : arena).push(ev);
      });
    }

    if (arena.length + amuzbar.length > 0) {
      arenaData = arena;
      amuzData  = amuzbar;
      isDemo    = false;
      setSync('ok');
      return true;
    }
    throw new Error('Aucune donnée');
  } catch (e) {
    console.warn('Fetch:', e);
    setSync('err');
    return false;
  }
}

function setSync(state) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLbl');
  dot.className = 'sync-dot ' + (state === 'ok' ? 'ok' : state === 'err' ? 'err' : 'demo');
  const t  = new Date();
  const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  lbl.textContent = state === 'ok'  ? `Sync ${ts}`
                  : state === 'err' ? 'Hors ligne'
                  :                   'Données de démo';
}

/* ══════════════════════════════════════════════════════════
   BARRE DE PROGRESSION
══════════════════════════════════════════════════════════ */
let progressInterval = null;

function startProgress(ms) {
  if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
  const fill = document.getElementById('progressFill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  fill.offsetHeight;
  fill.style.transition = `width ${ms}ms linear`;
  fill.style.width = '100%';
}

function startVideoProgress(vp) {
  if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
  const fill = document.getElementById('progressFill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  progressInterval = setInterval(() => {
    if (vp.duration && !isNaN(vp.duration) && vp.duration > 0) {
      fill.style.transition = 'none';
      fill.style.width = ((vp.currentTime / vp.duration) * 100).toFixed(1) + '%';
    }
  }, 400);
}

function stopProgress() {
  if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
}

/* ══════════════════════════════════════════════════════════
   BADGE DU SLIDE EN COURS
══════════════════════════════════════════════════════════ */
const BADGE_LABELS = {
  video:    'Vidéo',
  promo:    'Vous le saviez ?',
};
function updateBadge(type) {
  const b = document.getElementById('slideBadge');
  b.className  = 'slide-badge is-' + type;
  b.textContent = BADGE_LABELS[type] || 'CAROUSEL';
}

/* ══════════════════════════════════════════════════════════
   SCHEDULE PANEL — rendu (colonne de droite, toujours visible)
══════════════════════════════════════════════════════════ */
function renderSchedulePanel() {
  renderSchedSection(document.getElementById('schedArena'), arenaData, 'arena');
  renderSchedSection(document.getElementById('schedAmuz'),  amuzData,  'amuz');
}

function renderSchedSection(container, data, type) {
  const nm     = nowMin();
  const sorted = [...data].sort((a,b) => toMin(a.time) - toMin(b.time));

  /* Trouver l'événement en cours — plafonné à 30 min après le début */
  let curIdx = -1;
  for (let i = 0; i < sorted.length; i++) {
    const s = toMin(sorted[i].time);
    const nextStart = i + 1 < sorted.length ? toMin(sorted[i+1].time) : s + 30;
    const e = Math.min(nextStart, s + 30);   // max 30 min "en cours"
    if (nm >= s && nm < e) { curIdx = i; break; }
  }

  let html = '';

  if (curIdx >= 0) {
    const ev = sorted[curIdx];
    html += `
      <div class="sc-current ${type}">
        <div class="sc-now-label ${type}">
          <span class="pulse ${type}"></span>EN CE MOMENT
        </div>
        <div class="sc-now-row">
          <span class="sc-now-time">${fmtTime(ev.time)}</span>
          <span class="sc-now-title">${ev.title}</span>
        </div>
        ${ev.zone ? `<div class="sc-now-zone ${type}">${ev.zone}</div>` : ''}
      </div>`;

    /* Jusqu'à 2 animations suivantes */
    const upcoming = sorted.slice(curIdx + 1, curIdx + 3);
    if (upcoming.length) {
      html += `<div class="sc-upcoming-lbl">À VENIR</div>`;
      upcoming.forEach(ev => {
        html += `
          <div class="sc-item">
            <div class="sc-item-time">${fmtTime(ev.time)}</div>
            <div class="sc-item-body">
              <div class="sc-item-title">${ev.title}</div>
              ${ev.zone ? `<div class="sc-item-zone">${ev.zone}</div>` : ''}
            </div>
          </div>`;
      });
    }
  } else {
    /* Pas d'événement en cours — jusqu'à 4 prochains */
    const upcoming = sorted.filter(e => toMin(e.time) > nm).slice(0, 4);
    if (upcoming.length) {
      html += `<div class="sc-upcoming-lbl">À VENIR</div>`;
      upcoming.forEach((ev, i) => {
        html += `
          <div class="sc-item ${i === 0 ? 'is-next-' + type : ''}">
            <div class="sc-item-time">${fmtTime(ev.time)}</div>
            <div class="sc-item-body">
              <div class="sc-item-title">${ev.title}${i === 0 ? `<span class="sc-next-tag ${type}">SUIVANT</span>` : ''}</div>
              ${ev.zone ? `<div class="sc-item-zone">${ev.zone}</div>` : ''}
            </div>
          </div>`;
      });
    } else {
      html += `<div class="sc-empty">Aucune animation planifiée</div>`;
    }
  }

  container.innerHTML = html;
}

/* ══════════════════════════════════════════════════════════
   PROMO SLIDE — rendu
══════════════════════════════════════════════════════════ */
function renderPromo(promo) {
  document.getElementById('promoL1').innerHTML = promo.line1;
  document.getElementById('promoL2').innerHTML = promo.line2;
  document.getElementById('promoL3').innerHTML = promo.line3;

  const img = document.getElementById('promoPhoto');
  if (promo.photo) {
    img.src = promo.photo;
    img.classList.add('visible');
  } else {
    img.src = '';
    img.classList.remove('visible');
  }
}

/* ══════════════════════════════════════════════════════════
   CAROUSEL — machine d'état
   Cycle en 2 temps : Vidéo → Promo → Vidéo suivante → …
══════════════════════════════════════════════════════════ */
let step      = 0;
let videoIdx  = 0;
let promoIdx  = 0;
let currentSlideType = null;
let currentSlideEl   = null;
let carouselTimer    = null;
let slideStartTime   = 0;
let slideDuration    = 0;

function getNextSlide() {
  const phase = step % 2;
  let slide;

  if (phase === 0) {
    /* Étape 1 : Vidéo portrait + programme à droite */
    slide = { type: 'video', videoId: VIDEOS[videoIdx % VIDEOS.length] };
    videoIdx++;
  } else {
    /* Étape 2 : Message promo + programme à droite */
    slide = { type: 'promo', data: PROMOS[promoIdx % PROMOS.length] };
    promoIdx++;
  }

  step++;
  return slide;
}

function showSlide(slide) {
  const FADE = 500;

  /* ── 1. Fondu sortant ─────────────────────────────── */
  if (currentSlideEl) {
    currentSlideEl.style.transition = `opacity ${FADE}ms ease`;
    currentSlideEl.style.opacity    = '0';
    currentSlideEl.style.pointerEvents = 'none';
    currentSlideEl.classList.remove('active');
  }

  /* Arrêter la vidéo si on quitte le slide vidéo */
  if (currentSlideType === 'video' && slide.type !== 'video') {
    stopProgress();
    setTimeout(() => {
      const vp = document.getElementById('videoPlayer');
      vp.onended = null;
      vp.pause();
      vp.src = '';
    }, FADE + 50);
  }

  currentSlideType = slide.type;

  /* ── 2. Préparer et afficher le nouveau slide ─────── */
  const delay = currentSlideEl ? FADE : 0;
  setTimeout(() => {
    let el, dur;

    if (slide.type === 'video') {
      el = document.getElementById('slide-video');
      const vp = document.getElementById('videoPlayer');
      vp.onended = null;
      vp.src = slide.videoId;
      vp.load();
      vp.play().catch(() => {});
      renderSchedulePanel();

      /* Progression calée sur la durée réelle */
      vp.onloadedmetadata = () => startVideoProgress(vp);

      /* Passage automatique quand la vidéo se termine */
      vp.onended = () => {
        if (carouselTimer) clearTimeout(carouselTimer);
        showSlide(getNextSlide());
      };

      /* Filet de sécurité : 10 min max */
      if (carouselTimer) clearTimeout(carouselTimer);
      carouselTimer = setTimeout(() => showSlide(getNextSlide()), 10 * 60 * 1000);
      dur = null;

    } else if (slide.type === 'promo') {
      el  = document.getElementById('slide-promo');
      dur = durations.promo;
      renderPromo(slide.data);
      renderSchedulePanel();

    }

    /* Fondu entrant */
    el.style.transition    = 'none';
    el.style.opacity       = '0';
    el.style.pointerEvents = 'auto';
    el.offsetHeight;
    el.style.transition = `opacity ${FADE}ms ease`;
    el.style.opacity    = '1';
    el.classList.add('active');
    currentSlideEl = el;

    updateBadge(slide.type);
    if (dur !== null) {
      startProgress(dur);
      slideStartTime = Date.now();
      slideDuration  = dur;
      if (carouselTimer) clearTimeout(carouselTimer);
      carouselTimer = setTimeout(() => showSlide(getNextSlide()), dur);
    }

  }, delay);
}

/* ══════════════════════════════════════════════════════════
   NAVIGATION MANUELLE ◀ ▶
══════════════════════════════════════════════════════════ */
function cancelCurrentSlide() {
  if (carouselTimer) { clearTimeout(carouselTimer); carouselTimer = null; }
  stopProgress();
  if (currentSlideType === 'video') {
    const vp = document.getElementById('videoPlayer');
    vp.onended = null;
    vp.pause();
    vp.src = '';
  }
}

function navNext() {
  cancelCurrentSlide();
  showSlide(getNextSlide());
}

function navPrev() {
  cancelCurrentSlide();
  /* Reculer d'une étape :
     step vient d'être incrémenté, donc step-2 = étape précédente */
  const target      = Math.max(0, step - 2);
  const targetPhase = target % 2;
  /* Annuler l'incrément d'index qui avait eu lieu lors de l'affichage de cette étape */
  if (targetPhase === 0) videoIdx = Math.max(0, videoIdx - 1);
  if (targetPhase === 1) promoIdx = Math.max(0, promoIdx - 1);
  step = target;
  showSlide(getNextSlide());
}

/* ══════════════════════════════════════════════════════════
   RÉGLAGES (overlay)
══════════════════════════════════════════════════════════ */
function openSetup() {
  if (carouselTimer) clearTimeout(carouselTimer);
  stopProgress();
  if (currentSlideType === 'video') {
    document.getElementById('videoPlayer').pause();
  }
  document.getElementById('cfgUrl').value   = sheetUrl;
  document.getElementById('cfgPromo').value = durations.promo / 1000;
  document.getElementById('setupOverlay').classList.add('open');
}

function closeSetup() {
  document.getElementById('setupOverlay').classList.remove('open');
  if (currentSlideType === 'video') {
    const vp = document.getElementById('videoPlayer');
    vp.play().catch(() => {});
    startVideoProgress(vp);
    if (carouselTimer) clearTimeout(carouselTimer);
    carouselTimer = setTimeout(() => showSlide(getNextSlide()), 10 * 60 * 1000);
  } else {
    const elapsed   = Date.now() - slideStartTime;
    const remaining = Math.max(1000, slideDuration - elapsed);
    startProgress(remaining);
    if (carouselTimer) clearTimeout(carouselTimer);
    carouselTimer = setTimeout(() => showSlide(getNextSlide()), remaining);
  }
}

function saveSetup() {
  const url  = document.getElementById('cfgUrl').value.trim();
  const prm  = Math.max(3,  parseInt(document.getElementById('cfgPromo').value) || 5);

  sheetUrl = url;
  localStorage.setItem('c_url',   url);
  localStorage.setItem('c_promo', prm);
  durations = loadDurations();

  document.getElementById('setupOverlay').classList.remove('open');
  fetchSheet().then(ok => { if (!ok && isDemo) setSync('demo'); });
  step = 0; videoIdx = 0; promoIdx = 0;
  currentSlideEl = null; currentSlideType = null;
  if (carouselTimer) clearTimeout(carouselTimer);
  showSlide(getNextSlide());
}

/* ══════════════════════════════════════════════════════════
   DÉTECTION AUTOMATIQUE DES VIDÉOS
══════════════════════════════════════════════════════════ */
async function probeVideos() {
  const found = [];
  for (let i = 1; i <= 99; i++) {
    const name = 'Video_' + String(i).padStart(3, '0') + '.mp4';
    try {
      const res = await fetch(name, { method: 'HEAD' });
      if (!res.ok) break;
      found.push(name);
    } catch (e) {
      break;
    }
  }
  return found.length > 0 ? found : VIDEOS;
}

/* ══════════════════════════════════════════════════════════
   DÉTECTION AUTOMATIQUE DES IMAGES
   Dépose Image_001.png, Image_002.png… sur Netlify pour
   les associer aux promos (PROMOS[0] → Image_001.png, etc.)
══════════════════════════════════════════════════════════ */
async function probeImages() {
  const found = [];
  for (let i = 1; i <= 99; i++) {
    const name = 'Image_' + String(i).padStart(3, '0') + '.png';
    try {
      const res = await fetch(name, { method: 'HEAD' });
      if (!res.ok) break;
      found.push(name);
    } catch (e) {
      break;
    }
  }
  return found;
}

/* ══════════════════════════════════════════════════════════
   DÉMARRAGE
══════════════════════════════════════════════════════════ */
async function boot() {
  document.getElementById('dayStr').textContent = dayLabel();
  document.getElementById('clock').textContent  = clockStr();

  /* Détection automatique des fichiers Video_XXX.mp4 disponibles */
  VIDEOS = await probeVideos();

  /* Détection automatique des fichiers Image_XXX.png */
  const images = await probeImages();
  images.forEach((img, i) => {
    if (PROMOS[i]) PROMOS[i].photo = img;
  });

  if (sheetUrl) {
    setSync('demo');
    await fetchSheet();
  } else {
    setSync('demo');
  }

  /* Rendu initial du schedule panel */
  renderSchedulePanel();

  showSlide(getNextSlide());

  /* Rafraîchissement périodique des données */
  setInterval(async () => {
    await fetchSheet();
    renderSchedulePanel();
  }, REFRESH_MS);
}

/* Horloge — mise à jour chaque seconde */
setInterval(() => {
  document.getElementById('clock').textContent  = clockStr();
  document.getElementById('dayStr').textContent = dayLabel();
}, 1000);

boot();
</script>
