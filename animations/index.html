<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>d-fool® — Programme</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>

/* ─── RESET & ROOT ─────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:        #E8D8E7;   /* fond violet très clair */
  --bg2:       #CEAACB;   /* fond des cartes animations */
  --bg3:       #DAC2D9;   /* intermédiaire */
  --orange:    #CC0000;   /* rouge Arena */
  --orange-lo: rgba(200,0,0,.15);
  --gold:      #FFD700;   /* jaune — heures, horloge */
  --gold-lo:   rgba(255,215,0,.22);
  --purple:    #81227C;   /* violet foncé — texte animations */
  --purple-lo: rgba(129,34,124,.18);
  --purple-dk: #5A0A55;   /* violet très sombre — fond badges pill */
  --teal:      #1A7870;
  --white:     #81227C;   /* texte principal = violet foncé */
  --gray:      #B88AB6;   /* bordures */
  --muted:     #9A5098;   /* texte atténué */
  --light:     #81227C;   /* texte secondaire */
}

html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--white);
  font-family: 'Inter', sans-serif;
}

/* ─── ARCS DÉCORATIFS (style carte AmuzBar) ─────────────── */
body::before {
  content: '';
  position: fixed;
  width: 90vh; height: 90vh;
  border-radius: 50%;
  top: -30vh; right: -20vh;
  background: radial-gradient(circle, rgba(255,255,255,.28) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  width: 65vh; height: 65vh;
  border-radius: 50%;
  bottom: -18vh; left: -12vh;
  background: radial-gradient(circle, rgba(255,255,255,.20) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.page { position: relative; z-index: 1; }

/* ─── LAYOUT ────────────────────────────────────────────── */
.page {
  display: grid;
  grid-template-rows: 11vh 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ─── HEADER ──────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--gold);
  padding: 2vh 3vw 1.5vh;
  position: relative;
}

.logo {
  font-family: 'Inter', sans-serif;
  font-size: 4.2vh;
  font-weight: 900;
  letter-spacing: -.02em;
  line-height: 1;
  color: var(--white);
  text-transform: lowercase;
}

.header-mid {
  flex: 1;
  text-align: center;
  line-height: 1.2;
}
.day-str {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.6vh;
  letter-spacing: .12em;
  color: var(--white);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 2vh;
}
.clock {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 6.5vh;
  color: var(--gold);
  letter-spacing: .1em;
  line-height: 1;
  background: var(--purple-dk);
  border-radius: 1.2vh;
  padding: .55vh 1.4vh;
  display: inline-flex;
  align-items: center;
  border: 1.5px solid rgba(255,215,0,.25);
}
.sync-line {
  font-size: 1.3vh;
  letter-spacing: .08em;
  color: var(--muted);
  margin-top: .4vh;
  text-align: right;
}
.sync-dot {
  display: inline-block;
  width: .8vh; height: .8vh;
  border-radius: 50%;
  background: var(--muted);
  vertical-align: middle;
  margin-right: .4em;
}
.sync-dot.ok   { background: var(--teal); }
.sync-dot.err  { background: #ef4444; }
.sync-dot.demo { background: var(--gold); }

/* ─── PLANNING CONTENT ───────────────────────────────────── */
.planning-content {
  padding: 2vh 3vw 2vh 2.5vw;
  overflow: hidden;
  height: 100%;
}

.planning-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3vw;
  height: 100%;
  overflow: hidden;
}

/* ─── ARENA PANEL ─────────────────────────────────────── */
.arena-panel {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 2vh;
  overflow: hidden;
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 1.2vh;
  flex-shrink: 0;
}
.panel-badge {
  font-family: 'Lilita One', cursive;
  font-size: 3.2vh;
  letter-spacing: .06em;
  line-height: 1;
  background: #ffffff;
  border-radius: 2vh;
  padding: .5vh 1.8vh;
  display: inline-block;
}
.badge-arena { color: var(--purple); }
.badge-amuz  { color: var(--purple); }

/* Badge style carte AmuzBar — pill sombre + texte or */
.panel-tag {
  font-size: 1vh;
  letter-spacing: .2em;
  text-transform: uppercase;
  padding: .45vh 1.6vh;
  border-radius: 10vh;
  font-weight: 700;
  background: var(--purple-dk);
  color: var(--gold);
  border: 1.5px solid rgba(255,215,0,.3);
}

.now-lbl {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5vh;
  letter-spacing: .45em;
  color: var(--purple);
  display: flex;
  align-items: center;
  gap: .7vh;
  margin-bottom: .8vh;
}
.pulse-plain {
  width: 1vh; height: 1vh;
  border-radius: 50%;
  background: var(--purple);
  animation: pulseAnim 1.6s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes pulseAnim {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.3; transform:scale(1.4); }
}
.now-card {
  background: var(--purple-lo);
  border: 2px solid var(--purple);
  border-radius: 1.2vh;
  padding: 2.5vh 3vh;
}
.now-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 7vh;
  color: var(--gold);
  letter-spacing: .08em;
  line-height: 1;
  background: var(--purple-dk);
  border-radius: 1.1vh;
  padding: .55vh 1.4vh;
  display: inline-flex;
  align-items: center;
  border: 1.5px solid rgba(255,215,0,.2);
}
.now-title {
  font-size: 4vh;
  font-weight: 700;
  color: var(--white);
  line-height: 1.15;
  margin-top: .5vh;
}
.now-zone {
  display: inline-block;
  margin-top: 1.2vh;
  font-size: 1.3vh;
  letter-spacing: .2em;
  text-transform: uppercase;
  font-weight: 600;
  background: var(--purple-dk);
  color: var(--gold);
  padding: .4vh 1.4vh;
  border-radius: 10vh;
}
.next-tag {
  display: inline-block;
  font-size: 1vh;
  letter-spacing: .25em;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--gold);
  background: var(--purple-dk);
  padding: .3vh 1vh;
  border-radius: .4vh;
  margin-left: 1vh;
  vertical-align: middle;
  position: relative;
  top: -.2vh;
}
.quiet-card {
  display: none;
  background: var(--bg2);
  border: 1px solid var(--gray);
  border-radius: 1.2vh;
  padding: 3vh;
  text-align: center;
}
.q-time { font-family: 'Bebas Neue', sans-serif; font-size: 4vh; color: var(--light); letter-spacing: .06em; }
.q-lbl  { font-size: 2vh; color: var(--muted); margin-top: .5vh; }

.arena-lower {
  display: flex;
  flex-direction: column;
  gap: 1.5vh;
  overflow: hidden;
}
.upcoming-lbl {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4vh;
  letter-spacing: .45em;
  color: var(--light);
  margin-bottom: .6vh;
}
.sched-list {
  display: flex;
  flex-direction: column;
  gap: .8vh;
  overflow-y: auto;
  flex: 1;
  padding-right: .5vh;
}
.sched-list::-webkit-scrollbar { width: .4vh; }
.sched-list::-webkit-scrollbar-thumb { background: var(--gray); border-radius: .2vh; }

.sched-item {
  display: flex;
  align-items: center;
  gap: 2vh;
  padding: 1.4vh 2vh;
  background: var(--bg2);
  border-radius: .8vh;
  border: 1px solid transparent;
}
.sched-item.is-next { border-color: rgba(129,34,124,.5); background: var(--bg2); }
.sched-item.is-past { opacity: .3; }
.sched-item .s-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.2vh;
  color: var(--gold);
  letter-spacing: .06em;
  line-height: 1;
  flex-shrink: 0;
  background: var(--purple-dk);
  border-radius: .8vh;
  padding: .4vh 1vh;
  display: inline-flex;
  align-items: center;
  border: 1.5px solid rgba(255,215,0,.2);
}
.sched-item .s-body { flex: 1; }
.sched-item .s-title { font-size: 3.2vh; font-weight: 600; line-height: 1.25; }
.sched-item .s-zone  { font-size: 1.8vh; color: var(--light); letter-spacing: .1em; text-transform: uppercase; margin-top: .3vh; }
.sep-past {
  font-size: 1.1vh; letter-spacing: .3em; color: var(--muted);
  text-transform: uppercase; text-align: center;
  padding: .8vh 0; border-top: 1px solid var(--gray);
}
.empty-msg { color: var(--muted); font-size: 1.8vh; text-align: center; padding: 3vh 0; font-style: italic; }

/* ─── AMUZBAR PANEL ──────────────────────────────────────── */
.amuz-panel {
  border-left: 1px solid var(--gray);
  padding-left: 2.5vw;
  display: flex;
  flex-direction: column;
  gap: 1.5vh;
  overflow: hidden;
}
.amuz-list {
  display: flex;
  flex-direction: column;
  gap: 1vh;
  overflow-y: auto;
  flex: 1;
}
.amuz-list::-webkit-scrollbar { width: .4vh; }
.amuz-list::-webkit-scrollbar-thumb { background: var(--gray); border-radius: .2vh; }
.amuz-item {
  display: flex;
  align-items: flex-start;
  gap: 1.5vh;
  padding: 1.4vh 1.8vh;
  background: var(--bg2);
  border-radius: .8vh;
  border: 1px solid transparent;
}
.amuz-item.is-now  { border-color: var(--purple); background: var(--purple-lo); }
.amuz-item.is-past { opacity: .3; }
.amuz-item .a-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3vh;
  color: var(--gold);
  letter-spacing: .06em;
  line-height: 1;
  flex-shrink: 0;
  background: var(--purple-dk);
  border-radius: .8vh;
  padding: .4vh .9vh;
  display: inline-flex;
  align-items: center;
  border: 1.5px solid rgba(255,215,0,.2);
}
.amuz-item .a-body { flex: 1; }
.amuz-item .a-title { font-size: 2.6vh; font-weight: 600; line-height: 1.3; padding-top: .3vh; }
.amuz-item .a-zone-row { display: flex; align-items: center; gap: 1vh; margin-top: .3vh; }
.amuz-item .a-zone  { font-size: 1.7vh; color: var(--light); letter-spacing: .1em; text-transform: uppercase; }

</style>
</head>
<body>

<div class="page">

  <!-- ── HEADER ── -->
  <header>
    <div class="logo">d-fool<span style="font-style:normal">®</span></div>

    <div class="header-mid">
      <div class="day-str" id="dayStr">—</div>
    </div>

    <div class="header-right">
      <div>
        <div class="clock" id="clock">--:--</div>
        <div class="sync-line">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncLbl">chargement…</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ── PLANNING CONTENT ── -->
  <div class="planning-content">
    <div class="planning-grid">

      <!-- Arena panel -->
      <div class="arena-panel">
        <div class="panel-head">
          <span class="panel-badge badge-arena">ARENA</span>
          <span class="panel-tag tag-arena">Ticket requis</span>
        </div>

        <div id="pNowWrap">
          <div class="now-lbl"><span class="pulse-plain"></span>EN CE MOMENT</div>
          <div class="now-card">
            <div class="now-time"  id="pNowTime">--h--</div>
            <div class="now-title" id="pNowTitle">—</div>
            <span class="now-zone" id="pNowZone">—</span>
          </div>
        </div>

        <div class="quiet-card" id="pQuietCard">
          <div class="q-time" id="pQuietTime">—</div>
          <div class="q-lbl"  id="pQuietLbl">Prochaine animation</div>
        </div>

        <div class="arena-lower">
          <div class="upcoming-lbl" id="pUpcomingLbl">À VENIR</div>
          <div class="sched-list"   id="pSchedList"></div>
        </div>
      </div>

      <!-- AmuzBar panel -->
      <div class="amuz-panel">
        <div class="panel-head" style="margin-bottom:1.5vh;">
          <span class="panel-badge badge-amuz">AMUZBAR</span>
          <span class="panel-tag tag-amuz">Accès libre</span>
        </div>
        <div class="amuz-list" id="pAmuzList"></div>
      </div>

    </div><!-- /planning-grid -->
  </div><!-- /planning-content -->

</div><!-- /page -->

<script>
/* ══════════════════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════════════════ */
const DEFAULT_URL  = 'https://script.google.com/macros/s/AKfycbwWbQc-UUSLMq0dXe9sZw6w24azhxqrFOJWgGUhw0QrLVPykDF3qiCYBphauijfKP8j4g/exec';
const REFRESH_MS   = 30 * 1000;   // rafraîchissement toutes les 30 s

let sheetUrl = localStorage.getItem('c_url') || DEFAULT_URL;

/* ── Données de démo (utilisées si la feuille est vide) ─ */
const DEMO_ARENA = [
  { time:"10:15", title:"Tournoi Pixel Games : Switch VS",              zone:"Pixel" },
  { time:"11:00", title:"Battre un défouleur sur le Stomp",             zone:"Valo-Jump" },
  { time:"12:00", title:"Monster Match Multiball",                      zone:"Multiball" },
  { time:"13:00", title:"Puissance 4 Géant : clients vs défouleurs",   zone:"Puissance 4" },
  { time:"14:00", title:"Tournoi Blink Pro 🏆",                        zone:"Blink Pro" },
  { time:"15:00", title:"Combat de Joutes — défie un défouleur !",     zone:"Joutes" },
  { time:"16:00", title:"Highscore Hunt — meilleur score possible 🎯", zone:"Pixel" },
  { time:"17:00", title:"FINALE du tournoi du jour 🔥",                zone:"Arena" },
];
const DEMO_AMUZ = [
  { time:"11:00", title:"Bras de fer — Bats Tim le Grand 💪",    zone:"Bras de fer" },
  { time:"13:00", title:"Blind Test / Quiz",                       zone:"AmuzBar" },
  { time:"15:00", title:"Curling express",                         zone:"Curling" },
  { time:"17:00", title:"Karaoké 🎤 (jusqu'à la fermeture)",      zone:"Karaoké" },
];

let arenaData = [...DEMO_ARENA];
let amuzData  = [...DEMO_AMUZ];
let isDemo    = true;

/* ══════════════════════════════════════════════════════════
   UTILITAIRES
══════════════════════════════════════════════════════════ */
function toMin(t)   { const [h,m] = t.split(':').map(Number); return h*60+m; }
function fmtTime(t) { return t.replace(':', 'h'); }
function nowMin()   { const d = new Date(); return d.getHours()*60 + d.getMinutes(); }

const DAYS   = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet',
                'août','septembre','octobre','novembre','décembre'];

function dayLabel() {
  const d = new Date();
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function clockStr() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ══════════════════════════════════════════════════════════
   FETCH GOOGLE SHEETS
══════════════════════════════════════════════════════════ */
async function fetchSheet() {
  if (!sheetUrl) return false;
  try {
    const url  = sheetUrl + (sheetUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = (await resp.text()).trim();

    let arena = [], amuzbar = [];
    if (sheetUrl.includes('script.google.com') || text.startsWith('[')) {
      JSON.parse(text).forEach(r => {
        const ev = {
          time:  String(r.heure     || '').trim(),
          title: String(r.animation || '').trim(),
          zone:  String(r.zone      || '').trim(),
        };
        if (!ev.title || !ev.time) return;
        (/amuz/i.test(r.espace) ? amuzbar : arena).push(ev);
      });
    }

    if (arena.length + amuzbar.length > 0) {
      arenaData = arena;
      amuzData  = amuzbar;
      isDemo    = false;
      setSync('ok');
      return true;
    }
    throw new Error('Aucune donnée');
  } catch (e) {
    console.warn('Fetch:', e);
    setSync('err');
    return false;
  }
}

function setSync(state) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLbl');
  dot.className = 'sync-dot ' + (state === 'ok' ? 'ok' : state === 'err' ? 'err' : 'demo');
  const t  = new Date();
  const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  lbl.textContent = state === 'ok'  ? `Sync ${ts}`
                  : state === 'err' ? 'Hors ligne'
                  :                   'Données de démo';
}

/* ══════════════════════════════════════════════════════════
   PLANNING — rendu complet
══════════════════════════════════════════════════════════ */
function renderPlanning() {
  const nm     = nowMin();
  const sorted = [...arenaData].sort((a,b) => toMin(a.time) - toMin(b.time));

  let curIdx = -1;
  for (let i = 0; i < sorted.length; i++) {
    const s = toMin(sorted[i].time);
    const nextStart = i + 1 < sorted.length ? toMin(sorted[i+1].time) : s + 30;
    const e = Math.min(nextStart, s + 30);   // max 30 min "en cours"
    if (nm >= s && nm < e) { curIdx = i; break; }
  }

  const nowWrap   = document.getElementById('pNowWrap');
  const quietCard = document.getElementById('pQuietCard');

  if (curIdx >= 0) {
    const ev = sorted[curIdx];
    nowWrap.style.display   = '';
    quietCard.style.display = 'none';
    document.getElementById('pNowTime').textContent  = fmtTime(ev.time);
    document.getElementById('pNowTitle').textContent = ev.title;
    document.getElementById('pNowZone').textContent  = ev.zone || 'Arena';
  } else {
    nowWrap.style.display = 'none';
    const next = sorted.find(e => toMin(e.time) > nm);
    if (next) {
      quietCard.style.display = 'block';
      document.getElementById('pQuietTime').textContent = fmtTime(next.time);
      document.getElementById('pQuietLbl').textContent  = next.title;
    } else {
      quietCard.style.display = 'none';
    }
  }

  const list  = document.getElementById('pSchedList');
  const upLbl = document.getElementById('pUpcomingLbl');
  list.innerHTML = '';

  const upcoming = curIdx >= 0 ? sorted.slice(curIdx + 1) : sorted.filter(e => toMin(e.time) > nm);
  const past     = curIdx >= 0 ? sorted.slice(0, curIdx)  : sorted.filter(e => toMin(e.time) <= nm);

  upLbl.textContent = upcoming.length ? 'À VENIR'
                    : past.length     ? 'ANIMATIONS PASSÉES'
                    :                   'AUCUNE ANIMATION';

  upcoming.forEach((ev, i) => {
    const el = document.createElement('div');
    el.className = 'sched-item' + (i === 0 ? ' is-next' : '');
    el.innerHTML = `
      <div class="s-time">${fmtTime(ev.time)}</div>
      <div class="s-body">
        <div class="s-title">${ev.title}${i === 0 ? '<span class="next-tag">SUIVANT</span>' : ''}</div>
        ${ev.zone ? `<div class="s-zone">${ev.zone}</div>` : ''}
      </div>`;
    list.appendChild(el);
  });

  if (past.length && upcoming.length) {
    const sep = document.createElement('div');
    sep.className = 'sep-past';
    sep.textContent = '— PASSÉES —';
    list.appendChild(sep);
  }
  past.slice().reverse().forEach(ev => {
    const el = document.createElement('div');
    el.className = 'sched-item is-past';
    el.innerHTML = `
      <div class="s-time">${fmtTime(ev.time)}</div>
      <div class="s-body"><div class="s-title">${ev.title}</div></div>`;
    list.appendChild(el);
  });

  if (!list.children.length) {
    list.innerHTML = '<div class="empty-msg">Aucune animation Arena programmée.</div>';
  }

  /* ── AmuzBar ── */
  const aList = document.getElementById('pAmuzList');
  aList.innerHTML = '';
  const amuzSorted = [...amuzData].sort((a,b) => toMin(a.time) - toMin(b.time));

  let amuzCurIdx = -1;
  for (let i = 0; i < amuzSorted.length; i++) {
    const em  = toMin(amuzSorted[i].time);
    const nextStart = i + 1 < amuzSorted.length ? toMin(amuzSorted[i+1].time) : em + 30;
    const end = Math.min(nextStart, em + 30);
    if (nm >= em && nm < end) { amuzCurIdx = i; break; }
  }

  if (amuzCurIdx >= 0) {
    const ev = amuzSorted[amuzCurIdx];
    const nowEl = document.createElement('div');
    nowEl.className = 'amuz-item is-now';
    nowEl.innerHTML = `
      <div class="a-time">${fmtTime(ev.time)}</div>
      <div class="a-body">
        <div class="a-title">${ev.title}</div>
        ${ev.zone ? `<div class="a-zone">${ev.zone}</div>` : ''}
      </div>`;
    aList.appendChild(nowEl);
  }

  const amuzUpcoming = amuzCurIdx >= 0
    ? amuzSorted.slice(amuzCurIdx + 1)
    : amuzSorted.filter(ev => toMin(ev.time) > nm);

  amuzUpcoming.forEach((ev, i) => {
    const el = document.createElement('div');
    el.className = 'amuz-item';
    el.innerHTML = `
      <div class="a-time">${fmtTime(ev.time)}</div>
      <div class="a-body">
        <div class="a-title">${ev.title}</div>
        <div class="a-zone-row">
          ${ev.zone ? `<div class="a-zone">${ev.zone}</div>` : ''}
          ${i === 0 ? '<span class="next-tag">SUIVANT</span>' : ''}
        </div>
      </div>`;
    aList.appendChild(el);
  });

  const amuzPast = amuzCurIdx >= 0
    ? amuzSorted.slice(0, amuzCurIdx)
    : amuzSorted.filter(ev => toMin(ev.time) + 30 <= nm);

  if (amuzPast.length && (amuzCurIdx >= 0 || amuzUpcoming.length)) {
    const sep = document.createElement('div');
    sep.className = 'sep-past';
    sep.textContent = '— PASSÉES —';
    aList.appendChild(sep);
  }
  amuzPast.slice().reverse().forEach(ev => {
    const el = document.createElement('div');
    el.className = 'amuz-item is-past';
    el.innerHTML = `
      <div class="a-time">${fmtTime(ev.time)}</div>
      <div class="a-body"><div class="a-title">${ev.title}</div></div>`;
    aList.appendChild(el);
  });

  if (!aList.children.length) {
    aList.innerHTML = '<div class="empty-msg">Aucune animation AmuzBar programmée.</div>';
  }
}

/* ══════════════════════════════════════════════════════════
   DÉMARRAGE
══════════════════════════════════════════════════════════ */
async function boot() {
  document.getElementById('dayStr').textContent = dayLabel();
  document.getElementById('clock').textContent  = clockStr();

  if (sheetUrl) {
    setSync('demo');
    await fetchSheet();
  } else {
    setSync('demo');
  }

  renderPlanning();

  /* Rafraîchissement périodique */
  setInterval(async () => {
    await fetchSheet();
    renderPlanning();
  }, REFRESH_MS);
}

/* Horloge — mise à jour chaque seconde */
setInterval(() => {
  document.getElementById('clock').textContent  = clockStr();
  document.getElementById('dayStr').textContent = dayLabel();
  renderPlanning();
}, 1000);

boot();
</script>
